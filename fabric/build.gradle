//build.gradle fabric folder
plugins {
    id 'gg.essential.multi-version'
    id 'gg.essential.defaults'
}

loom.serverOnlyMinecraftJar()

repositories {
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://maven.nucleoid.xyz' }
}

dependencies {
    modImplementation include("net.kyori:adventure-platform-fabric:${fabric_adventure_platform_version}")
    modImplementation include("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")
    modImplementation include("eu.pb4:sgui:${fabric_sgui_version}")
    modImplementation include("net.william278.uniform:uniform-fabric:1.3.9+${project.name}")
    modImplementation include("net.william278.toilet:toilet-fabric:1.0.16+${project.name}")
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Manually include config deps due to the way including api deps works
    implementation include("de.exlll:configlib-core:4.6.1")
    implementation include("org.snakeyaml:snakeyaml-engine:2.10")
    implementation include('org.apache.commons:commons-pool2:2.12.1')

    // Include driver deps due to no runtime dep loading support
    implementation include("com.mysql:mysql-connector-j:$mysql_driver_version")
    implementation include("org.postgresql:postgresql:$postgres_driver_version")
    implementation include("org.mariadb.jdbc:mariadb-java-client:$mariadb_driver_version")
    implementation include("org.xerial.snappy:snappy-java:$snappy_version")
    implementation include("redis.clients:jedis:$jedis_version")
    implementation include("redis.clients.authentication:redis-authx-core:0.1.1-beta2") // Redis dep
    implementation include('org.apache.commons:commons-pool2:2.12.1') // Redis dep

    compileOnly 'net.william278:DesertWell:2.0.4'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.38'

    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation include(project(path: ":common"))
    project(":common").configurations.api.dependencies.each { dependency ->
        include(dependency)
    }
}

processResources {
    filesMatching(Arrays.asList("fabric.mod.json", "compatibility.yml")) {
        expand([
                version: version,
                fabric_loader_version: fabric_loader_version,
                fabric_minecraft_version: project.name,
                minecraft_version_range: minecraft_version_range
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    destinationDirectory.set(file("$projectDir/build/libs"))

    exclude('net.fabricmc:.*')
    exclude('net.kyori:.*')
    exclude '/mappings/*'
}

remapJar {
    dependsOn tasks.shadowJar
    mustRunAfter tasks.shadowJar
    inputFile = shadowJar.archiveFile.get()
    addNestedDependencies = true

    destinationDirectory.set(file("$rootDir/target/"))
    archiveClassifier.set('')

    // Fix upstream packaging bug in uniform-fabric:1.3.9+1.20.1: its uniform.mixins.json
    // requires ArgumentNodeMixin, but that mixin is guarded //#if MC>=12108 so the class
    // is never compiled for 1.20.1 -> server crashes during mixin PREPARE. The mixin is not
    // needed on 1.20.1; strip it from the nested jar's server mixin list.
    doLast {
        if (project.name != '1.20.1') {
            return
        }
        def outerJar = archiveFile.get().asFile
        def work = new File(temporaryDir, 'uniformPatch')
        project.delete(work)
        work.mkdirs()
        project.copy {
            from project.zipTree(outerJar)
            include 'META-INF/jars/uniform-fabric-*.jar'
            into work
        }
        def nested = project.fileTree(work) { include 'META-INF/jars/uniform-fabric-*.jar' }.files
        if (nested.isEmpty()) {
            logger.warn('[uniform-patch] no nested uniform jar found, skipping')
            return
        }
        def nestedJar = nested.iterator().next()
        def fixDir = new File(work, 'fix')
        fixDir.mkdirs()
        new File(fixDir, 'uniform.mixins.json').text = '''{
  "required": false,
  "minVersion": "0.8",
  "package": "net.william278.uniform.fabric.mixins",
  "compatibilityLevel": "JAVA_17",
  "server": [],
  "injectors": {
    "defaultRequire": 1
  }
}
'''
        // Replace uniform.mixins.json inside the nested uniform jar
        project.ant.zip(destfile: nestedJar, update: true) {
            fileset(dir: fixDir) { include(name: 'uniform.mixins.json') }
        }
        // Replace the nested uniform jar inside the remapped mod jar
        project.ant.zip(destfile: outerJar, update: true) {
            zipfileset(dir: nestedJar.parentFile, prefix: 'META-INF/jars') {
                include(name: nestedJar.name)
            }
        }
        logger.lifecycle("[uniform-patch] stripped ArgumentNodeMixin from ${nestedJar.name} in ${outerJar.name}")
    }
}

shadowJar.finalizedBy(remapJar)